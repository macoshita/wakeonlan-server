[package]
name = "wakeonlan-server"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
askama = "0.15.4"
axum = "0.8.8"
clap = { version = "4.5.58", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
urlencoding = "2.1.3"
wake-on-lan = "0.2.0"
